name: build release
run-name: Build release ${{ inputs.release_tag }}

# Single-sourced in the private source repository and copied into the generated public mirror. This
# maintainer-triggered workflow is the interpreter counterpart to dmtool's build-native workflow: it checks
# out one immutable private source ref, rebuilds every public artifact, commits the cumulative mirror with
# the publisher-owned identity, and uploads only to an existing draft release.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable a12-dmkits interpreter source tag"
        required: true
      source_sha:
        description: "Peeled commit SHA expected for source_ref"
        required: true
      artifact_version:
        description: "Interpreter package/Maven/API version"
        required: true
      release_tag:
        description: "Existing draft release tag"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-isolated
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the public mirror
        uses: actions/checkout@v6
        with:
          path: public

      - name: Checkout the private source tag
        uses: actions/checkout@v6
        with:
          repository: mbackschat/a12-dmkits
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Verify source provenance
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "$(sed -nE "s/^version = '([^']+)'/\1/p" build.gradle)" = "${{ inputs.artifact_version }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Verify the release is still a draft
        shell: bash
        run: |
          test "$(gh release view "${{ inputs.release_tag }}" --json isDraft -q .isDraft)" = true

      - name: Build and qualify the interpreter artifacts
        working-directory: source
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./build.sh --console=plain :interpreter:check

      - name: Assemble the cumulative public mirror and release payload
        shell: bash
        run: |
          source/scripts/assemble-interpreter-release-repo.sh \
            --destination "$GITHUB_WORKSPACE/public" \
            --assets-directory "$GITHUB_WORKSPACE/source/build/interpreter-release/public-assets" \
            --version "${{ inputs.artifact_version }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --source-tag "${{ inputs.source_ref }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --npm-tarball "$GITHUB_WORKSPACE/source/build/interpreter-release/npm/a12-interpreter-${{ inputs.artifact_version }}.tgz" \
            --maven-repository "$GITHUB_WORKSPACE/source/build/interpreter-release/maven" \
            --api-documentation "$GITHUB_WORKSPACE/source/build/interpreter-release/api-docs/stage/api/v${{ inputs.artifact_version }}" \
            --api-docs-archive "$GITHUB_WORKSPACE/source/build/interpreter-release/api-docs/dm-interpreter-${{ inputs.artifact_version }}-api-docs.zip" \
            --showcase "$GITHUB_WORKSPACE/source/build/interpreter-release/consumer/browser/dist" \
            --readme "$GITHUB_WORKSPACE/source/interpreter/public-release/README.md" \
            --changelog "$GITHUB_WORKSPACE/source/interpreter/CHANGELOG.md" \
            --license "$GITHUB_WORKSPACE/source/LICENSE" \
            --disclaimer "$GITHUB_WORKSPACE/source/interpreter/public-release/DISCLAIMER.md" \
            --privacy "$GITHUB_WORKSPACE/source/interpreter/public-release/privacy.html" \
            --landing-page "$GITHUB_WORKSPACE/source/interpreter/public-release/index.html" \
            --workflow-directory "$GITHUB_WORKSPACE/source/.github/interpreter-mirror-workflows"

      - name: Prepare the generated mirror commit with the release identity
        working-directory: public
        shell: bash
        run: |
          source ../source/scripts/release-git-identity.sh
          source ../source/scripts/interpreter-release-assets.sh
          source ../source/scripts/release-mirror-common.sh
          source ../source/scripts/interpreter-release-publisher-core.sh
          interpreter_release_verify_payload \
            "../source/build/interpreter-release/public-assets" \
            "${{ inputs.artifact_version }}" \
            "${{ inputs.release_tag }}" \
            "${{ inputs.source_ref }}" \
            "${{ inputs.source_sha }}"
          configure_release_git_identity "$GITHUB_WORKSPACE/public"
          git add -A
          git commit -m "release ${{ inputs.release_tag }}" || test -z "$(git status --porcelain)"
          interpreter_release_verify_commit_identities "$GITHUB_WORKSPACE/public"
          git tag -f "${{ inputs.release_tag }}"

      - name: Upload the immutable draft assets
        shell: bash
        run: |
          test "$(gh release view "${{ inputs.release_tag }}" --json isDraft -q .isDraft)" = true
          gh release upload "${{ inputs.release_tag }}" \
            source/build/interpreter-release/public-assets/* \
            --clobber

      - name: Publish the mirror commit and release tag atomically
        working-directory: public
        shell: bash
        run: |
          test "$(gh release view "${{ inputs.release_tag }}" --json isDraft -q .isDraft)" = true
          git push --atomic origin HEAD:main "+refs/tags/${{ inputs.release_tag }}"
