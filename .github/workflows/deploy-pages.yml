name: deploy pages
run-name: Deploy Pages for ${{ inputs.release_tag }}

# Deployment is manual and belongs to the publisher's go-live path. A mirror-content push therefore cannot
# make draft Maven/API/showcase content public before the release review has passed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Reviewed draft release whose site tree should go live"
        required: true

permissions:
  # GitHub exposes draft releases only to tokens with push-level repository access. The workflow needs
  # this permission solely so its pre-deployment draft check observes the real release state.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the generated public mirror
        uses: actions/checkout@v6

      - name: Verify the requested release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "${{ inputs.release_tag }}" --json isDraft -q .isDraft)" = true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
